name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editor:
    name: Editor (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build, and check js/dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "::error::js/dist is stale. Run 'npm run build' in js/ and commit the result." && exit 1)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: js/test-results/

  module:
    name: Module (PHPUnit on Drupal ${{ matrix.drupal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drupal: ['^10.3', '^11']
    steps:
      - uses: actions/checkout@v4
        with:
          path: formy
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite
          coverage: none
      - name: Lint PHP
        run: find formy/src formy/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Create a Drupal site with Webform
        run: |
          composer create-project "drupal/recommended-project:${{ matrix.drupal }}" drupal --no-interaction --no-install
          cd drupal
          composer config --no-plugins allow-plugins.cweagans/composer-patches true
          composer require --no-interaction "drupal/webform:^6.3@beta" "drupal/core-dev:${{ matrix.drupal }}" -W
          mkdir -p web/modules/custom
          cp -r ../formy web/modules/custom/formy
      - name: Unit tests
        working-directory: drupal
        run: |
          set +e
          vendor/bin/phpunit -c web/core --log-junit junit.xml web/modules/custom/formy/tests/src/Unit > phpunit.txt 2>&1
          status=$?
          cat phpunit.txt
          # Surface the result as an annotation (visible without the log).
          summary=$(tail -n 15 phpunit.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          if [ $status -eq 0 ] && grep -qE "OK \([1-9]|Tests: [1-9]" phpunit.txt; then
            echo "::notice title=PHPUnit::$(grep -E 'OK \(|Tests: ' phpunit.txt | tail -n 1)"
          else
            echo "::error title=PHPUnit::$summary"
            exit 1
          fi
